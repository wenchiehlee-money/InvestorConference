name: Ingest Earnings Audio

on:
  workflow_dispatch:
    inputs:
      stock_id:
        description: 'Stock ID (e.g. 2357, 2330, NVDA)'
        required: true
        default: '3231'
      year:
        description: 'Year (e.g. 2025)'
        required: true
        default: '2025'
      quarter:
        description: 'Quarter (1–4)'
        required: true
        default: '4'
      push:
        description: 'Commit & push downloaded materials after ingest'
        type: boolean
        default: true
      materials_only:
        description: 'Fetch mapped official PDFs only; skip audio/transcript discovery'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      STEM: ${{ inputs.stock_id }}_${{ inputs.year }}_q${{ inputs.quarter }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PATH
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/usr/local/bin"    >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
          pip3 install -q requests playwright yt-dlp python-dotenv
          python3 -m playwright install chromium --with-deps 2>/dev/null || \
          python3 -m playwright install chromium

      - name: Configure git identity
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Run ingest.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PUSH_FLAG=${{ inputs.push == true && '--push' || '' }}
          if [ "${{ inputs.materials_only }}" = "true" ]; then
            python3 skills/skill-company-investorconference-ingest/scripts/ingest.py \
              "${{ inputs.stock_id }}" \
              "${{ inputs.year }}" \
              "${{ inputs.quarter }}" \
              --materials-only
          else
            python3 skills/skill-company-investorconference-ingest/scripts/ingest.py \
              "${{ inputs.stock_id }}" \
              "${{ inputs.year }}" \
              "${{ inputs.quarter }}" \
              $PUSH_FLAG
          fi

      - name: Collect outputs
        id: collect
        run: |
          set -euo pipefail
          shopt -s nullglob

          ASSET_DIR="artifacts/${STEM}"
          mkdir -p "$ASSET_DIR"

          # Audio can be in tmp (unpushed) or stock folder (pushed)
          found=0
          for candidate in "tmp/${STEM}".* "${{ inputs.stock_id }}/${STEM}".*
          do
            # Only match audio and PDF/MD
            if [[ $candidate =~ \.(m4a|mp3|pdf|md)$ ]]; then
              cp "$candidate" "$ASSET_DIR/"
              echo "Collected: $candidate"
              found=1
            fi
          done

          echo "asset_dir=$ASSET_DIR" >> "$GITHUB_OUTPUT"

      - name: Commit official materials
        if: inputs.materials_only == true && inputs.push == true
        run: |
          set -euo pipefail
          shopt -s nullglob
          pdfs=(tmp/${STEM}_*.pdf)
          if [ ${#pdfs[@]} -eq 0 ]; then
            echo "No official PDFs downloaded; nothing to commit."
            exit 0
          fi
          mkdir -p "data/${{ inputs.stock_id }}"
          cp "${pdfs[@]}" "data/${{ inputs.stock_id }}/"
          git add "data/${{ inputs.stock_id }}"/*.pdf
          if git diff --cached --quiet; then
            echo "No new official PDF changes."
          else
            git commit -m "feat: add ${{ inputs.stock_id }} ${{ inputs.year }} Q${{ inputs.quarter }} official materials"
            git push origin main
          fi

      - name: Verify outputs
        run: |
          set -euo pipefail
          echo "✓ Collected assets:"
          ls -lh "${{ steps.collect.outputs.asset_dir }}"

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STEM }}
          path: ${{ steps.collect.outputs.asset_dir }}
