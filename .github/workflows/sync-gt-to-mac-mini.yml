name: Sync GT SRT to Mac-mini

on:
  workflow_dispatch:
    inputs:
      stem:
        description: 'Optional single stem to sync, e.g. 2480_2026_q2. Empty means all GT SRTs.'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - "data/**/*_GT.srt"

permissions:
  contents: read

jobs:
  sync-gt-to-mac-mini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build GT sync config
        id: config
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_STEM="${{ inputs.stem }}"
            if [ -n "$INPUT_STEM" ]; then
              FILES=$(find data -type f -name "${INPUT_STEM}_GT.srt" | sort)
            else
              FILES=$(find data -type f -name "*_GT.srt" | sort)
            fi
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            FILES=$(git diff --name-only "$BEFORE" "$AFTER" -- "data/**/*_GT.srt" | sort)
          fi

          FILES=$(printf '%s\n' "$FILES" | sed '/^$/d')
          if [ -z "$FILES" ]; then
            echo "No GT SRT files selected."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONFIG=".github/sync-gt-to-mac-mini.generated.yml"
          {
            echo "group:"
            echo "  - files:"
            while IFS= read -r FILE; do
              STEM=$(basename "$FILE" _GT.srt)
              echo "      - source: $FILE"
              echo "        dest: mlx-api-server-whisper/GroundTrue/${STEM}_GT.srt"
            done <<< "$FILES"
            echo "    repos:"
            echo "      - ZhongZheng782/Mac-mini"
          } > "$CONFIG"

          echo "has_files=true" >> "$GITHUB_OUTPUT"
          echo "config_path=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "GT sync config:"
          cat "$CONFIG"

      - name: Sync GT SRTs to Mac-mini
        if: steps.config.outputs.has_files == 'true'
        uses: BetaHuhn/repo-file-sync-action@latest
        with:
          GH_PAT: ${{ secrets.REPO_FILE_SYNC_ZHONGZHENG782_MONEY }}
          CONFIG_PATH: ${{ steps.config.outputs.config_path }}
          COMMIT_EACH_FILE: false
          PR_LABELS: "automated-sync"
          SKIP_PR: true
          COMMIT_BODY: "GT owner: InvestorConference; Mac-mini GroundTrue is cache."
