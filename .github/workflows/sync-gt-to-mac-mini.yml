name: Notify Mac-mini on GT SRT changes

on:
  workflow_dispatch:
    inputs:
      stem:
        description: 'Optional single stem to refine, e.g. 2480_2026_q2. Empty means all GT SRTs.'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - "data/**/*_GT.srt"

permissions:
  contents: read

jobs:
  notify-mac-mini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed GT stems
        id: stems
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_STEM="${{ inputs.stem }}"
            if [ -n "$INPUT_STEM" ]; then
              FILES=$(find data -type f -name "${INPUT_STEM}_GT.srt" | sort)
            else
              FILES=$(find data -type f -name "*_GT.srt" | sort)
            fi
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            FILES=$(git diff --name-only "$BEFORE" "$AFTER" -- "data/**/*_GT.srt" | sort)
          fi

          STEMS=$(printf '%s\n' "$FILES" \
            | sed -n 's#^data/[^/]*/\([^/]*\)_GT\.srt$#\1#p' \
            | sort -u)

          if [ -z "$STEMS" ]; then
            echo "No GT SRT changes detected."
            echo "stems=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "stems<<EOF"
            echo "$STEMS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed GT stems:"
          echo "$STEMS"

      - name: Dispatch Mac-mini refine runs
        if: steps.stems.outputs.stems != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_FILE_SYNC_ZHONGZHENG782_MONEY }}
          TARGET_REPO: ZhongZheng782/Mac-mini
          STEMS: ${{ steps.stems.outputs.stems }}
        shell: bash
        run: |
          while IFS= read -r STEM; do
            [ -n "$STEM" ] || continue
            echo "Dispatching Mac-mini refine for $STEM"
            gh workflow run run-pipeline.yml \
              --repo "$TARGET_REPO" \
              --ref main \
              -f stem="$STEM" \
              -f source_repo="wenchiehlee-money/InvestorConference" \
              -f source_type="investor_conference" \
              -f exps="auto" \
              -f skip_transcribe="true"
          done <<< "$STEMS"
