name: Daily Auto-Ingest from TODO

on:
  schedule:
    # Daily at 02:00 UTC (10:00 Taiwan time)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push new assets to repo'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  auto-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY1 }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml yt-dlp playwright python-dotenv
          playwright install --with-deps chromium

      - name: Configure git identity
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Run Auto-Ingest
        env:
          PUSH_FLAG: ${{ github.event.inputs.push || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "$PUSH_FLAG" = "true" ]; then
            python ingest.py --auto-todo --push
          else
            python ingest.py --auto-todo
          fi

      - name: Final README Update, generate health summary and push
        run: |
          python ingest.py --update-readme
          python scripts/generate_ic_health.py
          git add README.md data/reports/investor_conference_health_summary.csv raw_column_definition_IC.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: final README sync and update health [skip ci]"
          git pull --rebase origin main && git push origin main || echo "Nothing to push"

      - name: Manage missing FIN.srt issues
        env:
          REPO_FILE_SYNC_ZHONGZHENG782_MONEY: ${{ secrets.REPO_FILE_SYNC_ZHONGZHENG782_MONEY }}
        run: |
          python tools/manage_missing_fin_issues.py

      - name: Sync to Money biztrends.TW
        uses: BetaHuhn/repo-file-sync-action@latest
        with:
          GH_PAT: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY1 }}
          CONFIG_PATH: .github/sync-biztrends.yml
          COMMIT_EACH_FILE: false
          PR_LABELS: "automated-sync"
          SKIP_PR: true
